<header class="site-header">
  <h1>日拱一卒</h1>
  <p class="subtitle">每天推进一点点，事事都能有着落</p>
  <p class="subtitle hidden" id="lan-line"></p>
  <div class="header-actions">
    <button id="qr-btn" class="guide-entry" type="button" title="手机扫码访问本机（地址变了重新扫一次即可）"><svg class="ic" aria-hidden="true"><use href="#i-qr"/></svg>手机访问</button>
    <button id="guide-btn" class="guide-entry" type="button" title="看当前这一页怎么用（气泡里可切到完整教程）"><svg class="ic" aria-hidden="true"><use href="#i-help"/></svg>使用引导</button>
  </div>
  <div id="qr-pop" class="qr-pop hidden">
    <div class="qr-pop-title">手机扫码，直达本机</div>
    <div id="qr-img" class="qr-img"></div>
    <div id="qr-addr" class="qr-addr"></div>
    <div class="qr-hint">这个二维码会把上面的本机地址登记到跳转页，并打开当前 Pace。</div>
    <div class="qr-go-guide">
      <div class="qr-go-title">跳转页怎么用</div>
      <ol>
        <li>第一次：电脑保持 Pace 运行，手机与电脑连同一 Wi-Fi，扫码后会登记地址并自动进入。</li>
        <li>以后：收藏跳转页，或把它「添加到主屏幕」。家里、公司各扫一次后，打开它会自动寻找能连上的那台。</li>
        <li>电脑地址变了就重新扫码。跳转页只保存访问地址，任务和工时仍只存在各电脑本地。</li>
        <li>默认跳转页下载后即可使用。自托管时到「统计·设置 → 系统 → 跳转页地址」替换，设置会保存在本机。</li>
      </ol>
      <a id="qr-go-link" class="qr-go-link" href="https://c3h18o2.github.io/daily-pace/go.html" target="_blank" rel="noopener noreferrer">在新标签页打开跳转页</a>
    </div>
  </div>
</header>
